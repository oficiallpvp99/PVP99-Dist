  local min_stamina = 16 -- horas

  local label_nameTreiner = "goTrainer"

  local label_nameContinue = "goHunt"

  if stamina() < (min_stamina * 60) then

    gotoLabel(label_nameTreiner)

    g_settings.set('autoReconnect', false)

    CaveBot.setOff()

  else

  gotoLabel(label_nameContinue)

  g_settings.set('autoReconnect', true)

  end

  return true


]]
