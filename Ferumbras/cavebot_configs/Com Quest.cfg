function:[[

  -- NPC Talk, CaveBot Function

local npcName = "Yasir"

local conversation = {"hi"}

local talkDelay = 1500 -- ms

local maxDistance = 3 -- sqm

-- END CONFIG

local npc = getCreatureByName(npcName)

if not npc or retries > 20 then 

  return false 

end

local npcPos = npc:getPosition()

local wait = 300

if distanceFromPlayer(npcPos) > maxDistance then

  autoWalk(npcPos, 15, {precision=maxDistance})

  delay(wait)

  return "retry"

end

for i, msg in ipairs(conversation) do

  schedule(talkDelay * i, function()

    NPC.say(msg)

  end)

  wait = talkDelay * (i+1)

end

delay(wait)

return true


]]
